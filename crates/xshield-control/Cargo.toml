[package]
name = "xshield-control"
version = "4.0.0-rc1"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
chrono = { workspace = true, features = ["serde"] }
hyper-rustls.workspace = true
hyper-util.workspace = true
openssl.workspace = true
serde.workspace = true
serde_json.workspace = true
# Digests each declared position's key into its id (object_map.rs). The migration test
# also uses it, to compute the checksum independently (docs/04's adoption recipe).
sha2.workspace = true
# `macros` and `migrate` embed migrations/ in the binary (`sqlx::migrate!`) and apply the
# pending ones at start-up (docs/07 section 7.2.3). The gateway enables neither.
sqlx = { workspace = true, features = ["macros", "migrate"] }
tokio.workspace = true
tokio-stream.workspace = true
xshield-core = { path = "../xshield-core" }
xshield-judge = { path = "../xshield-judge" }
xshield-postgres = { path = "../xshield-postgres" }
zeroize.workspace = true

[dev-dependencies]
tower.workspace = true

[lints]
workspace = true
