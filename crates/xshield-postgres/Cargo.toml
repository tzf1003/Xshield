[package]
name = "xshield-postgres"
version = "4.0.0-rc1"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
# AES-256-GCM and HMAC for the sealed model keys (key_seal.rs). Already in the tree through
