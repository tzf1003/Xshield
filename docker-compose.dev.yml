services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${XSHIELD_DEV_POSTGRES_DB:-xshield}
      POSTGRES_USER: ${XSHIELD_DEV_POSTGRES_USER:-xshield_dev}
      POSTGRES_PASSWORD: ${XSHIELD_DEV_POSTGRES_PASSWORD:-xshield_dev}
    ports:
      - "127.0.0.1:${XSHIELD_DEV_POSTGRES_PORT:-55432}:5432"
    # The schema is not loaded here. xshield-control applies migrations/ at start-up
    # (docs/04 section 4.2); an initdb copy would leave the tables without the ledger.
    volumes:
      - xshield-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  xshield-dev-postgres:
