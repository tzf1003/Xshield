# Optional real-traffic source for manual observation runs against xshield-edge (docs/04 4.5.1).
# The acceptance lab (scripts/test_idor_lab.py) runs without Docker and does not use this file.
name: xshield-security-lab

services:
  juice-shop:
    image: bkimminich/juice-shop:v20.2.0@sha256:8739101ade29358abb5469ee66ae78e582c97ed0a5543a4ad102e5fa5193526b
    ports:
      - "127.0.0.1:53000:3000"
    environment:
      NODE_ENV: unsafe
    restart: unless-stopped
    networks: [lab]

networks:
  lab:
