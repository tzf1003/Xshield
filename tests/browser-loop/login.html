<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orders sign in</title>
</head>
<body>
<form id="login">
  <label>User <input id="user" name="user" autocomplete="username"></label>
  <button type="submit">Sign in</button>
</form>
<p id="message"></p>
<script>
  document.getElementById("login").addEventListener("submit", async (event) => {
    event.preventDefault();
    const response = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user: document.getElementById("user").value }),
    });
    if (!response.ok) {
      document.getElementById("message").textContent = "sign-in failed";
      return;
    }
    const { access_token: token } = await response.json();
    sessionStorage.setItem("orders.token", token);
    location.assign("/app");
  });
</script>
</body>
</html>
