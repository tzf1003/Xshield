# Install to /etc/tmpfiles.d/xshield.conf and run `systemd-tmpfiles --create`.
# Mirrors deploy/compose/compose.yaml's `volumes-init`: every directory an
# Xshield process writes to is private (0700) and owned by the service
# account, created once and left alone on later boots (`d`, not `D` or `C`,
# so an operator's restore into these paths is never wiped).
d /var/lib/xshield 0700 xshield xshield -
d /var/lib/xshield/edge-audit 0700 xshield xshield -
d /var/lib/xshield/edge-manifests 0700 xshield xshield -
d /var/lib/xshield/edge-checkpoints 0700 xshield xshield -
d /var/lib/xshield/edge-snapshot 0700 xshield xshield -
d /var/lib/xshield/control-audit 0700 xshield xshield -
d /var/lib/xshield/control-manifests 0700 xshield xshield -
d /var/lib/xshield/control-checkpoints 0700 xshield xshield -
d /var/lib/xshield/evidence 0700 xshield xshield -
d /etc/xshield 0750 root xshield -
d /etc/xshield/secrets 0750 root xshield -
