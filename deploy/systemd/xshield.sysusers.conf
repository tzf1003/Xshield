# Install to /etc/sysusers.d/xshield.conf and run `systemd-sysusers`.
# Matches the uid:gid the container images run as (Dockerfile: `useradd --system
# --uid 10001`), so a release tarball extracted on bare metal and a container
# image agree on file ownership if the same host ever runs both.
u xshield 10001:10001 "Xshield service account" /nonexistent /usr/sbin/nologin
