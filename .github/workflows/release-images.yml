name: release-images

# Publishes the three deployable images (Dockerfile targets edge, control,
# worker) for a release tag to GitHub Container Registry, with a build
# provenance attestation and SBOM, and signs each pushed digest with a keyless
# Sigstore signature bound to this workflow and tag (docs/19 19.7). Deploy by
# digest and verify before use:
#
#   cosign verify ghcr.io/<owner>/xshield-edge@sha256:... \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github.com/<owner>/<repo>/\.github/workflows/release-images\.yml@refs/tags/v'
#
# Runs only for v* tags; nothing on pull requests or branches publishes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # Keyless signing: the Sigstore certificate is issued for this workflow's OIDC identity.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target: [edge, control, worker]
    steps:
      - uses: actions/checkout@v4
      - id: name
        env:
          OWNER: ${{ github.repository_owner }}
          TARGET: ${{ matrix.target }}
        run: echo "image=ghcr.io/${OWNER,,}/xshield-${TARGET}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign and verify the pushed digest
        env:
          IMAGE: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign verify "$IMAGE" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$IDENTITY" >/dev/null
          echo "signed $IMAGE" >> "$GITHUB_STEP_SUMMARY"
