name: release-images

# Publishes the three deployable images (Dockerfile targets edge, control,
# worker) for a release tag to GitHub Container Registry, with a build
# provenance attestation and SBOM, and signs each pushed digest with a keyless
# Sigstore signature bound to this workflow and tag (docs/19 19.7). Deploy by
# digest and verify before use:
#
#   cosign verify ghcr.io/<owner>/xshield-edge@sha256:... \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github\.com/<owner>/<repo>/\.github/workflows/release-images\.yml@refs/(tags/v[0-9]+\.[0-9]+\.[0-9]+|heads/main)$'
#
# Runs for a pushed v* tag, or when release.yml calls it for the tag it just
# created (a tag pushed with GITHUB_TOKEN starts no workflow). Called from
# main, the signing identity is this file at refs/heads/main; the image's
# version and revision labels, and its provenance, name the released commit.
# Nothing on pull requests or other branches publishes.

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The v* tag to build and publish.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-images-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # Keyless signing: the Sigstore certificate is issued for this workflow's OIDC identity.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target: [edge, control, worker]
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: name
        env:
          OWNER: ${{ github.repository_owner }}
          TARGET: ${{ matrix.target }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: $TAG"; exit 1; }
          echo "image=ghcr.io/${OWNER,,}/xshield-${TARGET}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ steps.name.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign and verify the pushed digest
        env:
          IMAGE: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cosign sign --yes "$IMAGE"
          # The identity deployers verify (docs/19 19.7): this file, at a release
          # tag (tag push) or at main (called by release.yml).
          identity="^https://github\.com/${REPOSITORY//./\\.}/\.github/workflows/release-images\.yml@refs/(tags/v[0-9]+\.[0-9]+\.[0-9]+|heads/main)$"
          cosign verify "$IMAGE" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$identity" >/dev/null
          echo "signed $IMAGE" >> "$GITHUB_STEP_SUMMARY"
