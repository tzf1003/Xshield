name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Hosted minutes are metered. A newer push to the same pull request supersedes the older run
# (cancelled), while pushes to main are keyed by commit and always complete.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which of the expensive jobs a pull request needs. Pushes to main run everything.
  # The patterns err on the side of running: anything that can change what a job builds or
  # tests (including this workflow) selects it. `validate` and `supply-chain` always run.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.diff.outputs.web }}
      images: ${{ steps.diff.outputs.images }}
      fuzz: ${{ steps.diff.outputs.fuzz }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            printf 'web=true\nimages=true\nfuzz=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE"...HEAD)
          echo "$files"
          match() { if printf '%s\n' "$files" | grep -Eq "$1"; then echo true; else echo false; fi; }
          {
            echo "web=$(match '^(web/console/|tests/site-config/|\.github/)')"
            echo "images=$(match '^(Cargo\.(toml|lock)|rust-toolchain\.toml|Dockerfile|\.dockerignore|crates/|migrations/|tests/site-config/|\.github/)')"
            echo "fuzz=$(match '^(crates/xshield-core/|Cargo\.(toml|lock)|rust-toolchain\.toml|fuzz/|tests/site-config/|\.github/)')"
          } >> "$GITHUB_OUTPUT"

  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      XSHIELD_TEST_DATABASE_BASE_URL: postgresql://postgres:postgres@localhost:5432
      # A debug build of this workspace plus its test binaries is about 16 GB with
      # full debug info, more than the runner has free. Line tables keep backtraces
      # useful at a fraction of the size, and incremental artifacts are never reused.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      # The hosted runner ships tens of GB of toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      # Pinned to rust-toolchain.toml's channel: a floating `stable` turns every Rust
      # release's new pedantic lints into a red main. Bump both together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy,rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - run: pip install -r scripts/requirements.txt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc
      # docs/04 section 4.4: the acceptance scenarios against the real edge binary, with a
      # scripted Jev stand-in, so no model is called. The cargo steps above built the binary.
      - name: Acceptance scenarios (docs/04 4.3)
        run: python scripts/test_idor_lab.py
      - name: PostgreSQL integration
        run: scripts/test_postgres.sh
      - run: python scripts/validate_library.py
      - run: python scripts/check_env_docs.py
      - run: python scripts/check_secrets.py

  # Licenses, RustSec advisories, yanked crates and registry sources (deny.toml).
  # It reads Cargo.lock only, so it needs no database or build.
  # The fuzz targets (fuzz/) on the stable toolchain: every checked-in seed, including
  # each crash ever found, and fixed deterministic mutations of them. Coverage-guided
  # runs are in fuzz.yml. The crate is its own workspace, so it is linted here.
  fuzz-replay:
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy,rustfmt
      - run: cargo fmt --check
      # Not --locked: fuzz/Cargo.lock follows the product crates it depends on by path,
      # so a dependency change there updates it here; commit that update with it.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked
      # The graph a reviewer would otherwise rebuild by hand, kept with the run.
      - run: cargo tree --workspace --locked --duplicates > cargo-tree-duplicates.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-tree-duplicates
          path: cargo-tree-duplicates.txt

  # The deployable images (Dockerfile). Built, not pushed: this proves the build is
  # reproducible from the lockfile and that every binary finds the shared libraries it
  # links in the runtime image, which a local macOS run cannot show.
  container-images:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [edge, control]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: xshield-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Every binary resolves its shared libraries and runs unprivileged
        run: |
          image=xshield-${{ matrix.target }}:ci
          [ "$(docker run --rm --entrypoint id "$image" -u)" = "10001" ]
          for binary in $(docker run --rm --entrypoint sh "$image" -c 'ls /usr/local/bin'); do
            missing=$(docker run --rm --entrypoint ldd "$image" "/usr/local/bin/$binary" | grep "not found" || true)
            if [ -n "$missing" ]; then echo "$binary: $missing"; exit 1; fi
            echo "$binary: libraries resolve"
          done

  console:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # The browser suite has several hundred specs; a two-core runner needs
    # well over the ten minutes the original handful of specs took.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      # A two-core runner running two Chromium workers and two dev servers sometimes starves a
      # spec past even two retries (the mock tells a duplicate read by timing). Specs that
      # still failed get one more serial pass on a quiet machine; if they fail again the job fails.
      - name: Browser end-to-end suite
        run: |
          npm run test:e2e || {
            echo "::warning::re-running only the failed specs once, serially"
            npx playwright test --last-failed --workers=1
          }
