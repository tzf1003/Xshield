name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:25.8.29.51
        env:
          CLICKHOUSE_USER: xshield_test
          CLICKHOUSE_PASSWORD: xshield_test
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --spider -q http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      XSHIELD_TEST_DATABASE_BASE_URL: postgresql://postgres:postgres@localhost:5432
      XSHIELD_TEST_CLICKHOUSE_URL: http://localhost:8123
      XSHIELD_TEST_CLICKHOUSE_USER: xshield_test
      XSHIELD_TEST_CLICKHOUSE_PASSWORD: xshield_test
      # A debug build of this workspace plus its test binaries is about 16 GB with
      # full debug info, more than the runner has free. Line tables keep backtraces
      # useful at a fraction of the size, and incremental artifacts are never reused.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      # The hosted runner ships tens of GB of toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      # Pinned to rust-toolchain.toml's channel: a floating `stable` turns every Rust
      # release's new pedantic lints into a red main. Bump both together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - run: pip install -r scripts/requirements.txt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc
      - name: Rust to console HTTP wire contract
        run: cargo test -p xshield-control --lib console_client_ -- --ignored
      - run: node --test sensor/test/*.test.mjs
      - name: PostgreSQL and transactional Outbox integration
        run: scripts/test_postgres.sh
      - name: ClickHouse publication and search integration
        run: |
          cargo test -p xshield-worker --lib real_schema_publisher -- --ignored
          cargo test -p xshield-worker --test clickhouse_search -- --ignored
          cargo test -p xshield-control --lib management_audit -- --ignored
        timeout-minutes: 5
      - run: scripts/test_gateway_identity.sh
      - run: scripts/test_gateway_request_crypto.sh
      - name: IDOR lab (real edge, PostgreSQL ledger, local origins)
        env:
          XSHIELD_LAB_PGHOST: localhost
          XSHIELD_LAB_PGPORT: "5432"
          XSHIELD_LAB_PGUSER: postgres
          XSHIELD_LAB_PGPASSWORD: postgres
        run: scripts/test_idor_lab_local.sh
      - run: scripts/test_gateway_transport.sh
      - name: Real-browser provenance loop (Chromium, real edge over TLS, PostgreSQL)
        run: |
          npm ci --prefix web/console --no-audit --no-fund
          (cd web/console && npx playwright install --with-deps chromium --only-shell)
          scripts/test_browser_loop.sh
        timeout-minutes: 10
      - run: python scripts/validate_library.py
      - run: python scripts/check_audit_event_coverage.py
      - run: python scripts/check_env_docs.py
      - run: python scripts/check_secrets.py

  # Licenses, RustSec advisories, yanked crates and registry sources (deny.toml).
  # It reads Cargo.lock only, so it needs no database or build.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked
      # The graph a reviewer would otherwise rebuild by hand, kept with the run.
      - run: cargo tree --workspace --locked --duplicates > cargo-tree-duplicates.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-tree-duplicates
          path: cargo-tree-duplicates.txt

  console:
    runs-on: ubuntu-latest
    # The browser suite has several hundred specs; a two-core runner needs
    # well over the ten minutes the original handful of specs took.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      # A two-core runner running two Chromium workers and two dev servers sometimes starves a
      # spec past even two retries (the mock tells a duplicate read by timing). Specs that
      # still failed get one more serial pass on a quiet machine; if they fail again the job fails.
      - name: Browser end-to-end suite
        run: |
          npm run test:e2e || {
            echo "::warning::re-running only the failed specs once, serially"
            npx playwright test --last-failed --workers=1
          }
