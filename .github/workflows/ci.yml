name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Hosted minutes are metered. A newer push to the same pull request supersedes the older run
# (cancelled), while pushes to main are keyed by commit and always complete.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which of the expensive jobs a pull request needs. Pushes to main run everything.
  # The patterns err on the side of running: anything that can change what a job builds or
  # tests (including this workflow) selects it. `validate` and `supply-chain` always run.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.diff.outputs.web }}
      images: ${{ steps.diff.outputs.images }}
      oidc: ${{ steps.diff.outputs.oidc }}
      fuzz: ${{ steps.diff.outputs.fuzz }}
      evidence: ${{ steps.diff.outputs.evidence }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            printf 'web=true\nimages=true\noidc=true\nfuzz=true\nevidence=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE"...HEAD)
          echo "$files"
          match() { if printf '%s\n' "$files" | grep -Eq "$1"; then echo true; else echo false; fi; }
          {
            echo "web=$(match '^(web/console/|tests/site-config/|\.github/)')"
            echo "images=$(match '^(Cargo\.(toml|lock)|rust-toolchain\.toml|Dockerfile|\.dockerignore|crates/|sql/|sensor/|migrations/|tests/site-config/|deploy/|dev/keycloak/|scripts/test_(compose|helm)_deployment\.sh|\.github/)')"
            echo "oidc=$(match '^(crates/xshield-(control|audit|core)/|Cargo\.(toml|lock)|rust-toolchain\.toml|scripts/(test_oidc|lib/)|dev/keycloak/|web/console/|migrations/|\.github/)')"
            echo "fuzz=$(match '^(crates/xshield-(core|gateway|audit)/|sensor/src/|Cargo\.(toml|lock)|rust-toolchain\.toml|fuzz/|tests/site-config/|\.github/)')"
            echo "evidence=$(match '^(crates/xshield-(core|evidence)/|Cargo\.(toml|lock)|rust-toolchain\.toml|\.github/)')"
          } >> "$GITHUB_OUTPUT"

  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:25.8.29.51
        env:
          CLICKHOUSE_USER: xshield_test
          CLICKHOUSE_PASSWORD: xshield_test
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --spider -q http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      XSHIELD_TEST_DATABASE_BASE_URL: postgresql://postgres:postgres@localhost:5432
      XSHIELD_TEST_CLICKHOUSE_URL: http://localhost:8123
      XSHIELD_TEST_CLICKHOUSE_USER: xshield_test
      XSHIELD_TEST_CLICKHOUSE_PASSWORD: xshield_test
      # A debug build of this workspace plus its test binaries is about 16 GB with
      # full debug info, more than the runner has free. Line tables keep backtraces
      # useful at a fraction of the size, and incremental artifacts are never reused.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      # The hosted runner ships tens of GB of toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      # Pinned to rust-toolchain.toml's channel: a floating `stable` turns every Rust
      # release's new pedantic lints into a red main. Bump both together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy,rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - run: pip install -r scripts/requirements.txt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc
      - name: Rust to console HTTP wire contract
        run: cargo test -p xshield-control --lib console_client_ -- --ignored
      - run: node --test sensor/test/*.test.mjs
      - name: PostgreSQL and transactional Outbox integration
        run: scripts/test_postgres.sh
      - name: ClickHouse publication and search integration
        run: |
          cargo test -p xshield-worker --lib real_schema_publisher -- --ignored
          cargo test -p xshield-worker --test clickhouse_search -- --ignored
          cargo test -p xshield-control --lib management_audit -- --ignored
        timeout-minutes: 5
      - run: scripts/test_gateway_identity.sh
      - run: scripts/test_gateway_request_crypto.sh
      - name: IDOR lab (real edge, PostgreSQL ledger, local origins)
        env:
          XSHIELD_LAB_PGHOST: localhost
          XSHIELD_LAB_PGPORT: "5432"
          XSHIELD_LAB_PGUSER: postgres
          XSHIELD_LAB_PGPASSWORD: postgres
        run: scripts/test_idor_lab_local.sh
      - run: scripts/test_gateway_transport.sh
      - name: Real-browser provenance loop (Chromium, real edge over TLS, PostgreSQL)
        run: |
          npm ci --prefix web/console --no-audit --no-fund
          (cd web/console && npx playwright install --with-deps chromium --only-shell)
          scripts/test_browser_loop.sh
        timeout-minutes: 10
      - run: python scripts/validate_library.py
      - run: python scripts/check_audit_event_coverage.py
      - run: python scripts/check_env_docs.py
      - run: python scripts/check_secrets.py

  # The control plane's OIDC login against a real Keycloak (the dev realm), with the real
  # control binary and PostgreSQL, driven without a browser (scripts/test_oidc_login.py) and
  # then by a real Chromium through the console's Vite dev server (scripts/test_oidc_browser.sh).
  # Keycloak is the release zip, not the container image, so the job needs no registry pull;
  # the archive is checked against a pinned sha256 before it is unpacked. Keep the version
  # in step with docker-compose.dev.yml (quay.io/keycloak/keycloak) when it is bumped.
  oidc:
    needs: changes
    if: needs.changes.outputs.oidc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      XSHIELD_TEST_DATABASE_BASE_URL: postgresql://postgres:postgres@localhost:5432
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      KEYCLOAK_VERSION: 26.7.4
      KEYCLOAK_ZIP_SHA256: a286e98b4296d4e75ee88d8527c7cd463b307caa022f088c9f22cffccc741fa1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download and verify Keycloak
        run: |
          curl -fsSL -o "$RUNNER_TEMP/keycloak.zip" \
            "https://github.com/keycloak/keycloak/releases/download/${KEYCLOAK_VERSION}/keycloak-${KEYCLOAK_VERSION}.zip"
          echo "${KEYCLOAK_ZIP_SHA256}  $RUNNER_TEMP/keycloak.zip" | sha256sum -c -
          mkdir "$RUNNER_TEMP/keycloak"
          unzip -q "$RUNNER_TEMP/keycloak.zip" -d "$RUNNER_TEMP/keycloak"
          echo "XSHIELD_KEYCLOAK_HOME=$RUNNER_TEMP/keycloak/keycloak-${KEYCLOAK_VERSION}" >> "$GITHUB_ENV"
      - name: Real OIDC login (Keycloak, real control binary, PostgreSQL)
        run: scripts/test_oidc_login.sh
      # Both scripts build the control binary themselves; the second finds it already built.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - name: Real-browser OIDC login (Chromium, console dev server and proxy, Keycloak)
        run: |
          npm ci --prefix web/console --no-audit --no-fund
          (cd web/console && npx playwright install --with-deps chromium --only-shell)
          scripts/test_oidc_browser.sh
        timeout-minutes: 10

  # The S3 evidence backend (docs/12 12.10) against a real MinIO: SigV4 as a
  # server checks it, create-only writes, Object Lock refusing early deletion,
  # version-exact purge and orphan listing. MinIO's own image is no longer
  # published, so this is Chainguard's build, pinned by digest. A service
  # container cannot pass `server`, hence `docker run`.
  object-storage:
    needs: changes
    if: needs.changes.outputs.evidence == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      XSHIELD_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      XSHIELD_TEST_S3_ACCESS_KEY_ID: xshieldtest
      XSHIELD_TEST_S3_SECRET_ACCESS_KEY: xshieldtestsecret
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$XSHIELD_TEST_S3_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$XSHIELD_TEST_S3_SECRET_ACCESS_KEY" \
            cgr.dev/chainguard/minio@sha256:e70b2b1e74d79457f808710483bd726ff364529ca30736eaa15a6ab547d3a5a7 \
            server /tmp/data
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1
      - name: S3 evidence vault against MinIO
        run: cargo test -p xshield-evidence --lib s3_minio -- --ignored

  # Licenses, RustSec advisories, yanked crates and registry sources (deny.toml).
  # It reads Cargo.lock only, so it needs no database or build.
  # The fuzz targets (fuzz/) on the stable toolchain: every checked-in seed, including
  # each crash ever found, and fixed deterministic mutations of them. Coverage-guided
  # runs are in fuzz.yml. The crate is its own workspace, so it is linted here.
  fuzz-replay:
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy,rustfmt
      - run: cargo fmt --check
      # Not --locked: fuzz/Cargo.lock follows the product crates it depends on by path,
      # so a dependency change there updates it here; commit that update with it.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked
      # The graph a reviewer would otherwise rebuild by hand, kept with the run.
      - run: cargo tree --workspace --locked --duplicates > cargo-tree-duplicates.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-tree-duplicates
          path: cargo-tree-duplicates.txt

  # The deployable images (Dockerfile). Built, not pushed: this proves the build is
  # reproducible from the lockfile and that every binary finds the shared libraries it
  # links in the runtime image, which a local macOS run cannot show.
  container-images:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [edge, control, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: xshield-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Every binary resolves its shared libraries and runs unprivileged
        run: |
          image=xshield-${{ matrix.target }}:ci
          [ "$(docker run --rm --entrypoint id "$image" -u)" = "10001" ]
          for binary in $(docker run --rm --entrypoint sh "$image" -c 'ls /usr/local/bin'); do
            missing=$(docker run --rm --entrypoint ldd "$image" "/usr/local/bin/$binary" | grep "not found" || true)
            if [ -n "$missing" ]; then echo "$binary: $missing"; exit 1; fi
            echo "$binary: libraries resolve"
          done

  # The reference Compose deployment (deploy/compose, docs/19 19.8) brought up
  # whole from the three images: readiness, management API, signed apply
  # channel, restarts, resident jobs and audit publication into ClickHouse.
  compose:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: edge
          load: true
          push: false
          tags: xshield-edge:ci
          cache-from: type=gha,scope=edge
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: control
          load: true
          push: false
          tags: xshield-control:ci
          cache-from: type=gha,scope=control
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          load: true
          push: false
          tags: xshield-worker:ci
          cache-from: type=gha,scope=worker
      - name: Reference deployment smoke
        run: XSHIELD_IMAGE_TAG=ci scripts/test_compose_deployment.sh

  helm:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint and validate the chart
        run: |
          set -euo pipefail
          chart=deploy/helm/xshield
          # The schema refuses an install that leaves a required value empty.
          if helm template probe "$chart" >/dev/null 2>&1; then
            echo 'the chart rendered without its required values' >&2
            exit 1
          fi
          values=(-f deploy/helm/smoke/values.yaml
            --set images.edge=xshield-edge:ci --set images.control=xshield-control:ci
            --set images.worker=xshield-worker:ci
            --set-json 'control.allowedUpstreamCidrs=["10.0.0.0/8"]'
            --set metrics.serviceMonitor.enabled=true)
          helm lint --strict "$chart" "${values[@]}"
          helm template xshield "$chart" "${values[@]}" >"$RUNNER_TEMP/chart.yaml"
          docker run --rm -v "$RUNNER_TEMP:/v" -v "$PWD/deploy/helm/smoke:/s" \
            ghcr.io/yannh/kubeconform:v0.6.7@sha256:0925177fb05b44ce18574076141b5c3d83235e1904d3f952182ac99ddc45762c \
            -strict -summary -kubernetes-version 1.29.0 -ignore-missing-schemas /v/chart.yaml /s/deps.yaml
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: edge
          load: true
          push: false
          tags: xshield-edge:ci
          cache-from: type=gha,scope=edge
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: control
          load: true
          push: false
          tags: xshield-control:ci
          cache-from: type=gha,scope=control
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          load: true
          push: false
          tags: xshield-worker:ci
          cache-from: type=gha,scope=worker
      - uses: helm/kind-action@v1
        with:
          version: v0.25.0
          cluster_name: xshield
      - name: Load images into the cluster
        run: kind load docker-image xshield-edge:ci xshield-control:ci xshield-worker:ci --name xshield
      - name: Helm deployment smoke
        run: XSHIELD_IMAGE_TAG=ci scripts/test_helm_deployment.sh

  console:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # The browser suite has several hundred specs; a two-core runner needs
    # well over the ten minutes the original handful of specs took.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      # A two-core runner running two Chromium workers and two dev servers sometimes starves a
      # spec past even two retries (the mock tells a duplicate read by timing). Specs that
      # still failed get one more serial pass on a quiet machine; if they fail again the job fails.
      - name: Browser end-to-end suite
        run: |
          npm run test:e2e || {
            echo "::warning::re-running only the failed specs once, serially"
            npx playwright test --last-failed --workers=1
          }
