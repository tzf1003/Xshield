name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:25.8.29.51
        env:
          CLICKHOUSE_USER: xshield_test
          CLICKHOUSE_PASSWORD: xshield_test
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --spider -q http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      XSHIELD_TEST_DATABASE_BASE_URL: postgresql://postgres:postgres@localhost:5432
      XSHIELD_TEST_CLICKHOUSE_URL: http://localhost:8123
      XSHIELD_TEST_CLICKHOUSE_USER: xshield_test
      XSHIELD_TEST_CLICKHOUSE_PASSWORD: xshield_test
      # A debug build of this workspace plus its test binaries is about 16 GB with
      # full debug info, more than the runner has free. Line tables keep backtraces
      # useful at a fraction of the size, and incremental artifacts are never reused.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      # The hosted runner ships tens of GB of toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      # Pinned to rust-toolchain.toml's channel: a floating `stable` turns every Rust
      # release's new pedantic lints into a red main. Bump both together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy,rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - run: pip install -r scripts/requirements.txt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc
      - name: Rust to console HTTP wire contract
        run: cargo test -p xshield-control --lib console_client_ -- --ignored
      - run: node --test sensor/test/*.test.mjs
      - name: PostgreSQL and transactional Outbox integration
        run: scripts/test_postgres.sh
      - name: ClickHouse publication and search integration
        run: |
          cargo test -p xshield-worker --lib real_schema_publisher -- --ignored
          cargo test -p xshield-worker --test clickhouse_search -- --ignored
          cargo test -p xshield-control --lib management_audit -- --ignored
        timeout-minutes: 5
      - run: scripts/test_gateway_identity.sh
      - run: scripts/test_gateway_request_crypto.sh
      - name: IDOR lab (real edge, PostgreSQL ledger, local origins)
        env:
          XSHIELD_LAB_PGHOST: localhost
          XSHIELD_LAB_PGPORT: "5432"
          XSHIELD_LAB_PGUSER: postgres
          XSHIELD_LAB_PGPASSWORD: postgres
        run: scripts/test_idor_lab_local.sh
      - run: scripts/test_gateway_transport.sh
      - name: Real-browser provenance loop (Chromium, real edge over TLS, PostgreSQL)
        run: |
          npm ci --prefix web/console --no-audit --no-fund
          (cd web/console && npx playwright install --with-deps chromium --only-shell)
          scripts/test_browser_loop.sh
        timeout-minutes: 10
      - run: python scripts/validate_library.py
      - run: python scripts/check_audit_event_coverage.py
      - run: python scripts/check_env_docs.py
      - run: python scripts/check_secrets.py

  # The control plane's OIDC login against a real Keycloak (the dev realm), with the real
  # control binary and PostgreSQL, driven without a browser (scripts/test_oidc_login.py).
  # Keycloak is the release zip, not the container image, so the job needs no registry pull;
  # the archive is checked against a pinned sha256 before it is unpacked. Keep the version
  # in step with docker-compose.dev.yml (quay.io/keycloak/keycloak) when it is bumped.
  oidc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      XSHIELD_TEST_DATABASE_BASE_URL: postgresql://postgres:postgres@localhost:5432
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      KEYCLOAK_VERSION: 26.7.4
      KEYCLOAK_ZIP_SHA256: a286e98b4296d4e75ee88d8527c7cd463b307caa022f088c9f22cffccc741fa1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download and verify Keycloak
        run: |
          curl -fsSL -o "$RUNNER_TEMP/keycloak.zip" \
            "https://github.com/keycloak/keycloak/releases/download/${KEYCLOAK_VERSION}/keycloak-${KEYCLOAK_VERSION}.zip"
          echo "${KEYCLOAK_ZIP_SHA256}  $RUNNER_TEMP/keycloak.zip" | sha256sum -c -
          mkdir "$RUNNER_TEMP/keycloak"
          unzip -q "$RUNNER_TEMP/keycloak.zip" -d "$RUNNER_TEMP/keycloak"
          echo "XSHIELD_KEYCLOAK_HOME=$RUNNER_TEMP/keycloak/keycloak-${KEYCLOAK_VERSION}" >> "$GITHUB_ENV"
      - name: Real OIDC login (Keycloak, real control binary, PostgreSQL)
        run: scripts/test_oidc_login.sh

  # Licenses, RustSec advisories, yanked crates and registry sources (deny.toml).
  # It reads Cargo.lock only, so it needs no database or build.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked
      # The graph a reviewer would otherwise rebuild by hand, kept with the run.
      - run: cargo tree --workspace --locked --duplicates > cargo-tree-duplicates.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-tree-duplicates
          path: cargo-tree-duplicates.txt

  # The deployable images (Dockerfile). Built, not pushed: this proves the build is
  # reproducible from the lockfile and that every binary finds the shared libraries it
  # links in the runtime image, which a local macOS run cannot show.
  container-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [edge, control, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: xshield-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Every binary resolves its shared libraries and runs unprivileged
        run: |
          image=xshield-${{ matrix.target }}:ci
          [ "$(docker run --rm --entrypoint id "$image" -u)" = "10001" ]
          for binary in $(docker run --rm --entrypoint sh "$image" -c 'ls /usr/local/bin'); do
            missing=$(docker run --rm --entrypoint ldd "$image" "/usr/local/bin/$binary" | grep "not found" || true)
            if [ -n "$missing" ]; then echo "$binary: $missing"; exit 1; fi
            echo "$binary: libraries resolve"
          done

  console:
    runs-on: ubuntu-latest
    # The browser suite has several hundred specs; a two-core runner needs
    # well over the ten minutes the original handful of specs took.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      # A two-core runner running two Chromium workers and two dev servers sometimes starves a
      # spec past even two retries (the mock tells a duplicate read by timing). Specs that
      # still failed get one more serial pass on a quiet machine; if they fail again the job fails.
      - name: Browser end-to-end suite
        run: |
          npm run test:e2e || {
            echo "::warning::re-running only the failed specs once, serially"
            npx playwright test --last-failed --workers=1
          }
