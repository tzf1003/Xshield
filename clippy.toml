# Secrets are compared with xshield_core::constant_time::eq. The OpenSSL function panics on
# unequal lengths, which turns an attacker-chosen length into a dropped connection with no
# audit record.
disallowed-methods = [
    { path = "openssl::memcmp::eq", reason = "panics on unequal lengths; use xshield_core::constant_time::eq" },
]
