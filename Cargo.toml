[workspace]
members = ["crates/xshield-audit", "crates/xshield-control", "crates/xshield-core", "crates/xshield-evidence", "crates/xshield-gateway", "crates/xshield-postgres", "crates/xshield-worker"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
# None of these crates is published: they are one product, and the flag also lets
# `cargo deny` accept their path dependencies.
publish = false
rust-version = "1.94"

[workspace.dependencies]
subtle = "2.6"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clickhouse = { version = "=0.15.2", default-features = false, features = ["chrono", "rustls-tls-ring", "rustls-tls-webpki-roots"] }
crc32fast = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "webpki-tokio"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
openssl = "0.10"
openidconnect = "=4.0.1"
pingora = { version = "=0.9.0", default-features = false, features = ["openssl", "proxy"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
sqlx = { version = "=0.9.0", default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
tokio = { version = "~1.51", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5"
uuid = { version = "1", features = ["v7"] }
url = "2"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# 1.99 asks `assert!(x.is_empty())` to become `assert_eq!(x, [] as [T; 0])` with the element type spelled out,
# which is less readable in the async test code that uses it; the value shown on failure is the only gain.
assert_is_empty = "allow"
