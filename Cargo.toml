[workspace]
members = ["crates/xshield-audit", "crates/xshield-core", "crates/xshield-gateway", "crates/xshield-postgres"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crc32fast = "1"
openssl = "0.10"
pingora = { version = "=0.9.0", default-features = false, features = ["openssl", "proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "=0.9.0", default-features = false, features = ["json", "postgres", "runtime-tokio", "tls-rustls-ring-native-roots"] }
tokio = { version = "~1.51", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v7"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
